<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — QueueCare</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">✚</div>
      <span>QueueCare</span>
    </a>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <a href="/" style="text-decoration: none; color: var(--text-muted); font-size: 0.95rem;">← Back to Home</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-card" style="max-width: 480px;">
      <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.5rem;">✚</div>
      <h2 style="color: var(--primary-dark); font-size: 1.6rem; margin-bottom: 0.35rem;">QueueCare</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Sign in to your hospital account</p>

      <!-- Role Selection Pills (Hospital Accounts Only) -->
      <div class="role-pills">
        <button type="button" class="role-pill active" onclick="selectRole('staff', this)">Staff</button>
        <button type="button" class="role-pill" onclick="selectRole('doctor', this)">Doctor</button>
        <button type="button" class="role-pill" onclick="selectRole('admin', this)">Admin</button>
      </div>

      <!-- Prominent 1-Click Login Section -->
      <div style="margin-bottom: 1.5rem; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%); padding: 1rem; border-radius: var(--radius-md); border: 1.5px solid #bbf7d0; text-align: left;">
        <div style="font-size: 0.85rem; font-weight: 700; color: #166534; display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.75rem;">
          <span>⚡</span>
          <span>Instant 1-Click Login (Demo Accounts):</span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="btn btn-sm btn-primary" style="font-size: 0.8rem; justify-content: flex-start; padding: 0.5rem 0.75rem;" onclick="quickOneClickLogin('staff1', 'Staff@123', 'staff')">
            <span>👤</span> <span>Staff (staff1)</span>
          </button>
          <button type="button" class="btn btn-sm btn-primary" style="font-size: 0.8rem; justify-content: flex-start; padding: 0.5rem 0.75rem; background: #0288d1;" onclick="quickOneClickLogin('dr.mehta', 'Doctor@123', 'doctor')">
            <span>🩺</span> <span>Dr. Mehta (OPD)</span>
          </button>
          <button type="button" class="btn btn-sm btn-primary" style="font-size: 0.8rem; justify-content: flex-start; padding: 0.5rem 0.75rem; background: #0288d1;" onclick="quickOneClickLogin('dr.shah', 'Doctor@123', 'doctor')">
            <span>🩺</span> <span>Dr. Shah (OPD)</span>
          </button>
          <button type="button" class="btn btn-sm btn-primary" style="font-size: 0.8rem; justify-content: flex-start; padding: 0.5rem 0.75rem; background: #475569;" onclick="quickOneClickLogin('admin', 'Admin@123', 'admin')">
            <span>👑</span> <span>Admin (admin)</span>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.85rem;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="padding: 0 0.75rem;">or sign in manually</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <!-- Error Notification Banner -->
      <div id="loginErrorBox" style="display: none; background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; text-align: left;">
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group" style="text-align: left;">
          <label class="form-label">Username</label>
          <div style="position: relative;">
            <input type="text" id="usernameInput" class="form-control" placeholder="staff1" required autocomplete="username">
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem;">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top: 1.5rem; font-size: 1rem;">
          Login
        </button>
      </form>

      <div style="margin-top: 1.75rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1rem;">
        🔒 Secure • Role-Based Access • Patient Data Protection
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
